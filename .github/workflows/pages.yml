name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run route tests
        run: bun run test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: bun run build:pages
        env:
          GITHUB_PAGES_BUILD: "true"

      - name: Verify prerendered routes
        shell: bash
        run: |
          set -euo pipefail
          for route in \
            index.html \
            about/index.html \
            services/index.html \
            portfolio/index.html \
            brands/index.html \
            brands/heersare/index.html \
            brands/carwo/index.html \
            brands/markiz/index.html \
            pricing/index.html \
            contact/index.html
          do
            test -s ".output/public/$route"
          done

      - name: Add GitHub Pages route fallback
        run: cp .output/public/index.html .output/public/404.html

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
